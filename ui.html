<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Text2Layers</title>
  <script>
    window.tailwind = { config: { corePlugins: { preflight: false } } }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/typograf@7.4.4/dist/typograf.min.js"></script>
  <style>
    :root {
      --brand: #EF3124;
      --brand-hover: #d72b20;
    }
    html.figma-dark {
      --brand: #F83A2A;
      --brand-hover: #e63122;
    }

    #input {
      resize: none;
      width: 100%;
      background-color: var(--figma-color-bg-field, #fff);
      border: 1px solid var(--figma-color-border, #e6e6e6);
      color: var(--figma-color-text, #000);
      border-radius: 6px;
      padding: 8px;
      font-size: 14px;
      height: 192px;
      box-sizing: border-box;
      display: block;
    }
    #input::placeholder {
      color: var(--figma-color-text-disabled, #999);
    }
    #input:focus {
      outline: none;
      border-color: var(--figma-color-border-selected, #0d99ff);
      box-shadow: 0 0 0 2px var(--figma-color-border-selected-transparent, rgba(13,153,255,0.2));
    }
    html.figma-dark #input {
      background-color: #242424;
    }

    .a-button {
      background-color: var(--brand);
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
      color: #ffffff;
      border: none;
    }
    .a-button:hover { background-color: var(--brand-hover); }

    label { user-select: none; cursor: pointer; }

    input[type="checkbox"] {
      accent-color: var(--brand);
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    body {
      background-color: var(--figma-color-bg, #fff);
      color: var(--figma-color-text, #000);
      padding: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin: 0;
    }

    #loader.hidden { display: none !important; }
    #loader svg, #loader span { color: var(--brand); }

    #app { display: none; }
    #app.visible { display: block !important; }
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="loader" class="flex items-center justify-center h-24">
    <div class="flex flex-col items-center gap-2">
      <svg class="animate-spin w-7 h-7" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span class="font-semibold">Загрузка...</span>
    </div>
  </div>

  <!-- App -->
  <div id="app">
    <textarea
      id="input"
      class="mb-4"
      placeholder="Вставьте текст..."
    ></textarea>

    <div class="flex gap-3 justify-between w-full mb-6">
      <div class="flex flex-col gap-2">
        <label class="flex items-center gap-2">
          <input type="checkbox" id="capitalize" checked>
          <span class="text-sm">Начинать каждую строку с заглавной буквы</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" id="removeBullets" checked>
          <span class="text-sm">Удалять маркеры списка (•, -)</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" id="removePunctuation" checked>
          <span class="text-sm">Удалить знаки препинания в конце строк</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" id="enableTypograph" checked>
          <span class="text-sm">Оттипографить текст</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" id="fillAllWithFirstLine">
          <span class="text-sm">Заполнить все поля первой строкой</span>
        </label>
      </div>

      <div class="flex flex-col items-end gap-2 text-sm text-right" style="color: var(--figma-color-text-secondary);">
        <p>Выделено текстовых слоёв: <span id="selectedCount">0</span></p>
        <p>Кол-во строк в поле: <span id="linesCount">0</span></p>
      </div>
    </div>

    <button id="applyBtn" class="a-button">Вставить текст</button>
  </div>

  <script>
    const textarea = document.getElementById('input');
    const capitalize = document.getElementById('capitalize');
    const removeBullets = document.getElementById('removeBullets');
    const removePunctuation = document.getElementById('removePunctuation');
    const enableTypograph = document.getElementById('enableTypograph');
    const fillAllWithFirstLine = document.getElementById('fillAllWithFirstLine');
    const applyBtn = document.getElementById('applyBtn');
    const loader = document.getElementById('loader');
    const app = document.getElementById('app');
    const selectedCountEl = document.getElementById('selectedCount');
    const linesCountEl = document.getElementById('linesCount');

    function showApp() {
      loader.classList.add('hidden');
      app.classList.add('visible');
    }

    function updateLinesCount() {
      const lines = textarea.value
        ? textarea.value.split('\n').filter(l => l.trim().length > 0).length
        : 0;
      linesCountEl.textContent = lines;
    }

    const fallbackTimer = setTimeout(showApp, 2000);

    onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'update-selected-count') {
        clearTimeout(fallbackTimer);
        showApp();
        selectedCountEl.textContent = msg.count || 0;
        updateLinesCount();
      }
    };

    textarea.addEventListener('input', () => {
      updateLinesCount();
      parent.postMessage({ pluginMessage: { type: 'request-selected-count' } }, '*');
    });

    applyBtn.addEventListener('click', () => {
      let text = textarea.value;

      if (enableTypograph.checked && window.Typograf) {
        const tp = new Typograf({ locale: ['ru', 'en-US'] });
        text = tp.execute(text);
      }

      const selectedCount = parseInt(selectedCountEl.textContent, 10) || 0;

      parent.postMessage({
        pluginMessage: {
          type: 'split-and-insert',
          text,
          capitalize: capitalize.checked,
          removeBullets: removeBullets.checked,
          removePunctuation: removePunctuation.checked,
          fillAllWithFirstLine: fillAllWithFirstLine.checked,
          selectedCount,
        }
      }, '*');
    });

    parent.postMessage({ pluginMessage: { type: 'request-selected-count' } }, '*');
  </script>

</body>
</html>
